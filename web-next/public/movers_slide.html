<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Biggest Movers &middot; Patch 7.2d</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1600px; height:1000px; overflow:hidden; background:#07090d;
         font-family:Inter,system-ui,sans-serif; color:#fff; }
  .slide { position:relative; width:1600px; height:1000px; padding:34px 40px 26px;
            display:flex; flex-direction:column; }
  /* A flat split rather than a frosted panel: winners live on green ground,
     losers on red, and the eye sorts the slide before reading a word. */
  .slide::before { content:""; position:absolute; inset:0;
    background:linear-gradient(180deg,#0d2a1c 0%,#07090d 46%,#07090d 54%,#2a0f13 100%);
    z-index:-1; }

  header { display:flex; align-items:flex-end; justify-content:space-between;
            padding-bottom:14px; border-bottom:3px solid rgba(255,255,255,.14); }
  .kicker { font-family:"Barlow Condensed",sans-serif; font-size:22px; letter-spacing:.18em;
             text-transform:uppercase; color:#93a3b8; }
  h1 { font-size:52px; font-weight:900; letter-spacing:-.02em; line-height:1; margin-top:2px; }
  h1 em { font-style:normal; color:#4da3ff; }
  .meta { text-align:right; font-size:17px; color:#93a3b8; line-height:1.5; }
  .meta b { color:#e8eef7; font-weight:700; }

  .band { flex:1; display:flex; flex-direction:column; justify-content:center; gap:12px; }
  .rowlab { font-family:"Barlow Condensed",sans-serif; font-size:26px; letter-spacing:.2em;
             text-transform:uppercase; display:flex; align-items:center; gap:12px; }
  .rowlab.up { color:#3ddc84; }
  .rowlab.down { color:#ff6b6b; }
  .rowlab::after { content:""; flex:1; height:2px; background:currentColor; opacity:.32; }

  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:16px; }
  .tile { position:relative; height:318px; overflow:hidden; border-radius:4px; }
  .art { position:absolute; inset:0; background-size:cover; background-position:top center;
          filter:grayscale(.12) contrast(1.05) saturate(1.05); }
  /* Hard duotone rather than a blur: the colour does the sorting, the art
     stays legible, and it looks nothing like the frosted slides. */
  .tile.up .wash { position:absolute; inset:0;
    background:linear-gradient(180deg,rgba(6,40,26,.06) 0%,rgba(6,40,26,.30) 52%,rgba(4,22,15,.94) 100%);
    mix-blend-mode:multiply; }
  .tile.down .wash { position:absolute; inset:0;
    background:linear-gradient(180deg,rgba(48,8,12,.06) 0%,rgba(48,8,12,.30) 52%,rgba(23,6,10,.94) 100%);
    mix-blend-mode:multiply; }
  .tile.up { box-shadow:inset 0 0 0 2px rgba(61,220,132,.55); }
  .tile.down { box-shadow:inset 0 0 0 2px rgba(255,107,107,.5); }

  /* The number sits in the top corner, not across the face. At 74px centred
     it covered the champion it was describing -- and the art is the reason
     anyone stops scrolling, so it wins the middle of the tile. */
  .num { position:absolute; top:10px; left:12px;
          font-size:44px; font-weight:900; letter-spacing:-.03em; line-height:1;
          text-shadow:0 3px 14px rgba(0,0,0,.92), 0 0 3px rgba(0,0,0,.8); }
  .tile.up .num { color:#4dffa0; }
  .tile.down .num { color:#ff8080; }

  figcaption { position:absolute; left:0; right:0; bottom:0; padding:12px 14px 13px;
                background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.88) 55%);
                display:flex; flex-direction:column; gap:3px; }
  .nm { font-size:29px; font-weight:900; letter-spacing:-.01em; line-height:1;
         text-transform:uppercase; }
  .sub { font-size:15px; color:#c3cfdd; font-weight:500; }
  .tag { position:absolute; top:-236px; right:12px;
          font-family:"Barlow Condensed",sans-serif; font-size:15px; letter-spacing:.14em;
          background:#ffd45e; color:#20180a; font-weight:700; padding:3px 8px; border-radius:3px; }

  footer { display:flex; justify-content:space-between; align-items:center;
            padding-top:14px; font-size:15px; color:#7b8899; }
  footer img { height:26px; display:block; }
</style></head>
<body>

      </figure>
      <figure class="tile down">
        <div class="art" style="background-image:url('https://game.gtimg.cn/images/lgamem/act/lrlib/img/CardPictures/S_R_1005412.png')"></div>

    </div>

    <footer>

</body></html>
