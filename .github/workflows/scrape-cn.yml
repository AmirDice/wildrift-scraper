name: Scrape China win rates

# The official China server (lolm.qq.com) publishes fresh champion win/pick/ban
# rates daily, so this runs daily to match. It used to run every three days,
# which left the site showing numbers up to 72 hours old and kept newly
# released champions out of the rank brackets for days after they picked up
# enough games to appear.
#
# Paused 2026-09-23 and resumed 2026-10-15. While it was off, the movers page
# went on showing the 7.3 window under the current patch's name and nothing
# recorded China's last pre-7.3b days, so the 7.3b baseline had to fall back
# to 7 October. On a patch day, move MOVERS_PATCH, MOVERS_PATCH_LIVE and
# MOVERS_BASELINE_DATE in scripts/scrape_cn.mjs together.
#
# The job also refreshes the official Wild Rift skin list (wr_skins.json).
#
# The job commits data/cn_winrates.json, web-next/src/data/cn.json and the dated
# snapshot under data/history/cn/, then (optionally) pings a Vercel deploy hook
# so the statically generated pages pick the new numbers up.
on:
  schedule:
    # 06:00 UTC daily.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-cn
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scrape China win rates
        run: node scripts/scrape_cn.mjs

      # Official Wild Rift skin list for the champion pages' Skins tab.
      # Rewrites web-next/src/data/wr_skins.json only when a skin was added
      # or renamed, and refuses a run that lost champions or skins, so a
      # failure here never touches the China data or the published list.
      - name: Fetch Wild Rift skins
        continue-on-error: true
        run: python3 scripts/fetch_wr_skins.py

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "wrtruemeta-bot"
          git config user.email "actions@github.com"
          git add data/cn_winrates.json data/history/cn web-next/src/data/cn.json web-next/src/data/cn_movers.json web-next/src/data/wr_skins.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No CN win-rate changes."
          else
            if git diff --cached --quiet -- web-next/src/data/wr_skins.json; then
              git commit -m "Update China win rates ($(date -u +%Y-%m-%d))"
            else
              git commit -m "Update China win rates and Wild Rift skins ($(date -u +%Y-%m-%d))"
            fi
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger a redeploy
        # Add VERCEL_DEPLOY_HOOK in the repo secrets to have the site rebuild
        # with the new numbers. Without it the data lands on the next deploy.
        if: steps.commit.outputs.changed == 'true' && env.HOOK != ''
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -sS -X POST "$HOOK"
